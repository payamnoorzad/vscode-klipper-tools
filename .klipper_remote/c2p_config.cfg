[include c2p_macro.cfg]

[pause_resume]
recover_velocity = 50
xy_speed = 300
z_speed = 15
xy_park = 10,10
z_lift = 30
retract = 3
retract_speed = 900

[c2p_z_switch_calibration]
pin_c2p = ^!PC1 # Pin Z switch connect
speed = 1      # The speed (in mm/sec) to retract between probes
lift_speed = 3
samples = 3
sample_retract_dist = 2
samples_tolerance = 0.035
samples_tolerance_retries = 2
probe_body_position = 97,-25.5,15
probe_trigger_position = 97,-25.5,15
nozzle_position = 97,-93.5,35

[c2p_xy_camera_calibration]
tools_xy = 145.2,136
t0_offset_xy = 0.0,0.0
t1_offset_xy = 0.0,0.0
t2_offset_xy = 0.0,0.0
t3_offset_xy = 0.0,0.0
z_position = 92.63
speed_xy = 7800
speed_z = 600

[c2p_switch gantry]
pin = ^!PF1

[c2p_switch switc_T0]
pin = ^!PE7

[c2p_switch switc_T1]
pin = ^!PG0

[c2p_switch switc_T2]
pin = ^!PF14

[c2p_switch switc_T3]
pin = ^!PF12

[gcode_macro _SHUD_DOWN]
gcode = 
	SET_PIN PIN=PS_ON VALUE=0

[c2p_tool 0]
extruder = extruder
zone = 150,120
park = 13.2,402

[c2p_tool 1]
extruder = extruder1
zone = 150,120
park = 105,402

[c2p_tool 2]
extruder = extruder2
zone = 150,120
park = 197.5,396.5

[c2p_tool 3]
extruder = extruder3
zone = 150,120
park = 291.6,381.0

[gcode_macro STORE_TOOL_EXTRADATA]
variable_countextrud = 4
variable_zmmback = 20
variable_z_speed = 1200
variable_movebacktools = 15000 # when tools back to parts print in toolschange
variable_movefastspeed = 15000#15000 # trivel speed
variable_moveslowspeed_1 = 8500#5000 # first park speed
variable_moveslowspeed_2 = 4500#2000 # secound park speed
variable_moveslowspeed_3 = 500#200 # third park speed : Means finish park
variable_park1 = 90 # first park
variable_park2 = 15 # secound park
variable_park3 = 3.5  # third park
gcode = 

[output_pin _magnet_pin]
pin = PA3
value = 0
shutdown_value = 0

[output_pin LED_Env_Light]
pin = PA5
value = 1
shutdown_value = 1

[output_pin RESET_EDDY]
pin = PA9
value = 1
shutdown_value = 1

[c2p_probe]
x_position = 100
y_position = 100
x_clean_position = 50
y_clean_position = 50
xy_speed = 250
z_safe_speed = 20
z_touch_speed = 5
z_sample_speed = 2
z_retract_speed = 50
z_max_down = 18
safe_z = 140
samples = 2
samples_result = median
sample_retract_dist = 0.2
samples_tolerance = 0.03
samples_tolerance_retries = 3

[c2p_bed_mesh]
speed = 300
horizontal_move_z = 30
lift_after_probe = 1.0
mesh_min = 20, 20  #1,44 Offset
mesh_max = 280, 280  #1,44 Offset
probe_count = 4,4
mesh_pps = 2,2
algorithm = bicubic
bicubic_tension = 0.2

[c2p_nozzleclean]
variable_high_temp = 250
variable_low_temp = 165
variable_purge_len = 15
variable_retract_len = 1.0
variable_purge_speed = 3.0
variable_retract_speed = 10.0
variable_park_x = 108
variable_park_y = -43
variable_safe_z = 22
variable_wipe_z = 2
variable_wipe_amplitude = 5
variable_wipe_cycles = 8
variable_wipe_feedrate = 6000
variable_travel_feedrate = 8000
variable_z_lift_after = 5

