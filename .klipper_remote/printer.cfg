#[include tools_printer.cfg]
[include c2p_config.cfg]
#[include Test_Machine/Config_TEST.cfg]
[include fluidd.cfg]
# [include calibrate_pa.cfg]
[include timelapse.cfg]
[virtual_sdcard]
path: /home/biqu/printer_data/gcodes
[include mainsail.cfg]
[include c2p_print_trace.cfg]
[mcu]
canbus_uuid = 2f55c83f02a5


[thermistor my_thermistor_1]
temperature1 = 25
resistance1 = 100000
temperature2 = 150
resistance2 = 1791
temperature3 = 300
resistance3 = 141


[thermistor my_test_thermistor_1]
temperature1 = 25
resistance1 = 100000
temperature2 = 75
resistance2 = 14809
temperature3 = 120
resistance3 = 3869

# Motor1
[stepper_x]
step_pin: PE6
dir_pin: !PE5
enable_pin: !PC14
microsteps: 64
rotation_distance: 40
endstop_pin: ^PF4
position_endstop: 0
position_min: 0
position_max: 303
homing_speed: 100

# Motor2
[stepper_y]
step_pin: PE2
dir_pin:  !PE1
enable_pin: !PE4
microsteps: 64
rotation_distance: 40
endstop_pin: ^PF3
position_endstop: -30
position_min: -30
position_max: 410
homing_speed: 100

# Motor3
[stepper_z]
step_pin: PB8
dir_pin: PB7
enable_pin: !PE0
microsteps: 32
rotation_distance: 2.5
endstop_pin: ^PF2 #probe:z_virtual_endstop #^!PF5
position_endstop: 339 #297.3
position_max: 340 #298.3
position_min: 0
homing_speed: 30
second_homing_speed: 3
homing_retract_dist: 5

[tmc5160 stepper_x]
cs_pin: PC13
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
interpolate: False
run_current: 2.4
hold_current: 1
sense_resistor: 0.033

[tmc5160 stepper_y]
cs_pin: PE3
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
interpolate: False
run_current: 2.4
hold_current: 1
sense_resistor: 0.033

# Motor3
[tmc5160 stepper_z]
cs_pin: PB9
spi_software_miso_pin: PG7
spi_software_sclk_pin: PG8
spi_software_mosi_pin: PG6
run_current: 1.7
hold_current: 1
sense_resistor: 0.033
#stealthchop_threshold: 999999

[bed_mesh]
speed:300
horizontal_move_z: 30
mesh_min: -40, 10 #1,44 Offset 
mesh_max: 300, 340 #1,44 Offset
probe_count: 5,5
mesh_pps: 2,2
algorithm: bicubic
bicubic_tension: 0.2


[probe]
pin: ^!PC15
x_probe = 100
y_probe = 100
xy_probe_speed = 100
z_probe = 30
z_probe_speed = 40
x_offset = 0
y_offset = 0
speed = 5
samples = 1
samples_result = median
sample_retract_dist = 2.0
samples_tolerance = 0.02
samples_tolerance_retries = 3
z_offset = 0

[input_shaper]
shaper_type_x:mzv
shaper_freq_x: 37.7
shaper_type_y: 2hump_ei
shaper_freq_y: 37.7

[heater_bed]
heater_pin: PF5
sensor_pin: PB1
sensor_type: my_test_thermistor_1
control: pid
pid_Kp=70.614
pid_Ki=2.121
pid_Kd=587.862
min_temp: -200
max_temp: 190

[verify_heater heater_bed]
max_error: 150
check_gain_time: 1800
hysteresis: 5
heating_gain: 0.1

