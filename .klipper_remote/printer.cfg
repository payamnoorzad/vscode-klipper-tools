[gcode_button _EMC_ERROR]
pin: ^PD13
press_gcode:
    M112
    M118 press_gcode EMC_ERROR
release_gcode:
    M118 release_gcode EMC_ERROR

[output_pin EMC_RESET]
pin:PD12
value:0
shutdown_value:0

# [fan_generic Env_Fan]
# pin: PB8

# [output_pin Env_Relay_Power]
# pin:PE0
# value:0
# shutdown_value:1

[output_pin PS_ON]
pin:PD14
value:1
shutdown_value:1

# [output_pin POWER_ON_INDICTOR]
# pin:PA5
# value:1
# shutdown_value:1

[fan_generic partfan]
pin = PF8

[fan_generic hepafan]
pin = PF7

[fan_generic extraPartfan]
pin = PA2

[printer]
kinematics: corexy
max_velocity: 1500
max_accel: 6000
minimum_cruise_ratio: 0.5
# max_accel_to_decel:3500
max_z_velocity:50 #15
max_z_accel: 50 #50
square_corner_velocity: 5#5

[board_pins]
aliases:
    # EXP1 header
    EXP1_1=PE9, EXP1_2=PE10,
    EXP1_3=PE11, EXP1_4=PE12,
    EXP1_5=PE13, EXP1_6=PE14,    # Slot in the socket on this side
    EXP1_7=PE15, EXP1_8=PB10,
    EXP1_9=<GND>, EXP1_10=<5V>,

    # EXP2 header
    EXP2_1=PB14, EXP2_2=PB13,
    EXP2_3=PF7, EXP2_4=PB12,
    EXP2_5=PE7, EXP2_6=PB11,      # Slot in the socket on this side
    EXP2_7=PE8, EXP2_8=<RST>,
    EXP2_9=<GND>, EXP2_10=PC5

